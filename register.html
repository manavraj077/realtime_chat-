<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Create Account</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #075e54,
                    #128c7e
                );

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

        }


        .register-box {

            width: 380px;

            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 10px 30px
                rgba(0,0,0,0.25);

        }


        h2 {

            text-align: center;

            margin-top: 0;

            color: #075e54;

        }


        .subtitle {

            text-align: center;

            color: #777;

            margin-bottom: 25px;

        }


        label {

            display: block;

            margin-bottom: 6px;

            font-weight: bold;

        }


        input {

            width: 100%;

            padding: 12px;

            margin-bottom: 18px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 15px;

            outline: none;

        }


        input:focus {

            border-color: #075e54;

        }


        button {

            width: 100%;

            padding: 12px;

            background: #075e54;

            color: white;

            border: none;

            border-radius: 6px;

            font-size: 16px;

            cursor: pointer;

        }


        button:hover {

            background: #064e46;

        }


        #message {

            text-align: center;

            margin-top: 15px;

            font-size: 14px;

        }


        .login-link {

            text-align: center;

            margin-top: 20px;

        }


        .login-link a {

            color: #075e54;

            text-decoration: none;

            font-weight: bold;

        }

    </style>

</head>


<body>


<div class="register-box">


    <h2>Create Account</h2>


    <div class="subtitle">

        Create your chat account

    </div>


    <form id="registerForm">


        <label>
            Username
        </label>


        <input
            type="text"
            id="username"
            placeholder="Enter username"
            autocomplete="username"
            required
        >


        <label>
            Password
        </label>


        <input
            type="password"
            id="password"
            placeholder="Enter password"
            autocomplete="new-password"
            required
        >


        <label>
            Confirm Password
        </label>


        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm password"
            autocomplete="new-password"
            required
        >


        <button type="submit">
            Create Account
        </button>


    </form>


    <div id="message"></div>


    <div class="login-link">

        Already have an account?

        <a href="/login.html">
            Login
        </a>

    </div>


</div>


<script>


const form =
    document.getElementById(
        "registerForm"
    );


const message =
    document.getElementById(
        "message"
    );


form.addEventListener(
    "submit",
    async function (e) {

        e.preventDefault();


        const username =
            document
                .getElementById("username")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        const confirmPassword =
            document
                .getElementById("confirmPassword")
                .value;


        if (
            password !==
            confirmPassword
        ) {

            message.textContent =
                "Passwords do not match.";

            message.style.color =
                "red";

            return;

        }


        try {

            const response =
                await fetch(
                    "/register",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            username:
                                username,

                            password:
                                password

                        })

                    }
                );


            const data =
                await response.json();


            if (
                data.success
            ) {

                message.textContent =
                    data.message;

                message.style.color =
                    "green";


                setTimeout(
                    function () {

                        window.location.href =
                            "/login.html";

                    },
                    1000
                );

            }
            else {

                message.textContent =
                    data.message;

                message.style.color =
                    "red";

            }

        }
        catch (error) {

            message.textContent =
                "Server connection failed.";

            message.style.color =
                "red";

        }

    }
);

</script>


</body>

</html>
