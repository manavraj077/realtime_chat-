<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <!-- Google Sign-In -->
    <script src="https://accounts.google.com/gsi/client"
        async
        defer>
    </script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #075e54,
                    #128c7e
                );

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

        }

        .login-box {

            width: 380px;

            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.25);

        }

        h2 {

            text-align: center;

            margin-top: 0;

            color: #075e54;

        }

        .subtitle {

            text-align: center;

            color: #777;

            margin-bottom: 25px;

        }

        label {

            display: block;

            margin-bottom: 6px;

            font-weight: bold;

        }

        input {

            width: 100%;

            padding: 12px;

            margin-bottom: 18px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 15px;

            outline: none;

        }

        input:focus {

            border-color: #075e54;

        }

        button {

            width: 100%;

            padding: 12px;

            background: #075e54;

            color: white;

            border: none;

            border-radius: 6px;

            font-size: 16px;

            cursor: pointer;

        }

        button:hover {

            background: #064e46;

        }

        #message {

            text-align: center;

            margin-top: 15px;

            color: red;

            font-size: 14px;

        }

        .divider {

            display: flex;

            align-items: center;

            gap: 10px;

            margin: 25px 0;

            color: #888;

            font-size: 14px;

        }

        .divider::before,
        .divider::after {

            content: "";

            flex: 1;

            height: 1px;

            background: #ddd;

        }

        .google-login {

            display: flex;

            justify-content: center;

            width: 100%;

        }

        .register-link {

            text-align: center;

            margin-top: 20px;

        }

        .register-link a {

            color: #075e54;

            text-decoration: none;

            font-weight: bold;

        }

        .phone-login-button {
            margin-top: 15px;
            background: white;
            color: #075e54;
            border: 1px solid #075e54;
        }

        .phone-login-button:hover {
            background: #f0faf8;
        }

        #phoneLoginBox {
            display: none;
            margin-top: 15px;
        }

        #phoneMessage {
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
        }

    </style>

</head>


<body>


<div class="login-box">


    <h2>
        Welcome Back
    </h2>


    <div class="subtitle">

        Login to your chat account

    </div>


    <!-- Normal Username/Password Login -->

    <form id="loginForm">


        <label>
            Username
        </label>


        <input
            type="text"
            id="username"
            placeholder="Enter username"
            autocomplete="username"
            required
        >


        <label>
            Password
        </label>


        <input
            type="password"
            id="password"
            placeholder="Enter password"
            autocomplete="current-password"
            required
        >


        <button type="submit">

            Login

        </button>


    </form>


    <div id="message"></div>

    <!-- Phone Login -->

    <button
        type="button"
        id="phoneLoginButton"
        class="phone-login-button"
    >
        📱 Login with Phone
    </button>

    <div id="phoneLoginBox">

        <label>Phone Number</label>

        <input
            type="tel"
            id="phone"
            placeholder="Enter 10-digit phone number"
            inputmode="numeric"
            maxlength="10"
        >

        <button type="button" id="sendOtpButton">
            Send OTP
        </button>

        <input
            type="text"
            id="otp"
            placeholder="Enter 6-digit OTP"
            inputmode="numeric"
            maxlength="6"
            style="display:none; margin-top:10px;"
        >

        <button
            type="button"
            id="verifyOtpButton"
            style="display:none; margin-top:10px;"
        >
            Verify OTP
        </button>

        <button
            type="button"
            id="backToLoginButton"
            style="display:none; margin-top:10px; background:#777;"
        >
            Back to Username Login
        </button>

        <div id="phoneMessage"></div>

    </div>


    <!-- Divider -->

    <div class="divider">

        OR

    </div>


    <!-- Google Login -->

    <div class="google-login">

        <div
            id="g_id_onload"

            data-client_id="4260594162-det9iqgjp3b6ufidcvtuvnkjpl4o31ap.apps.googleusercontent.com"

            data-callback="handleGoogleLogin"

            data-auto_prompt="false">

        </div>


        <div
            class="g_id_signin"

            data-type="standard"

            data-size="large"

            data-theme="outline"

            data-text="continue_with"

            data-shape="rectangular"

            data-width="300">

        </div>

    </div>


    <!-- Register -->

    <div class="register-link">

        Don't have an account?

        <a href="/register.html">

            Create Account

        </a>

    </div>


</div>


<script>


/* =========================================
   NORMAL USERNAME/PASSWORD LOGIN
========================================= */


const form =
    document.getElementById(
        "loginForm"
    );


const message =
    document.getElementById(
        "message"
    );


form.addEventListener(
    "submit",

    async function (e) {

        e.preventDefault();


        const username =
            document
                .getElementById("username")
                .value
                .trim();


        const password =
            document
                .getElementById("password")
                .value;


        try {

            const response =
                await fetch(
                    "/login",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                username:
                                    username,

                                password:
                                    password

                            })

                    }
                );


            const data =
                await response.json();


            if (data.success) {


                localStorage.setItem(
                    "chatToken",
                    data.token
                );


                localStorage.setItem(
                    "chatUsername",
                    data.username
                );


                message.style.color =
                    "green";


                message.textContent =
                    "Login successful!";


                setTimeout(
                    function () {

                        window.location.href =
                            "/index.html";

                    },

                    500
                );


            }

            else {

                message.style.color =
                    "red";


                message.textContent =
                    data.message ||
                    "Login failed.";

            }


        }

        catch (error) {

            console.error(error);


            message.style.color =
                "red";


            message.textContent =
                "Server connection failed.";

        }

    }
);

/* =========================================
   PHONE OTP LOGIN
========================================= */

const phoneLoginButton =
    document.getElementById("phoneLoginButton");

const phoneLoginBox =
    document.getElementById("phoneLoginBox");

const sendOtpButton =
    document.getElementById("sendOtpButton");

const verifyOtpButton =
    document.getElementById("verifyOtpButton");

const backToLoginButton =
    document.getElementById("backToLoginButton");

const phoneInput =
    document.getElementById("phone");

const otpInput =
    document.getElementById("otp");

const phoneMessage =
    document.getElementById("phoneMessage");


phoneLoginButton.addEventListener("click", function () {

    form.style.display = "none";
    phoneLoginButton.style.display = "none";
    phoneLoginBox.style.display = "block";

    phoneInput.focus();
});


backToLoginButton.addEventListener("click", function () {

    phoneLoginBox.style.display = "none";
    phoneLoginButton.style.display = "block";
    form.style.display = "block";

    phoneInput.value = "";
    otpInput.value = "";

    otpInput.style.display = "none";
    verifyOtpButton.style.display = "none";
    backToLoginButton.style.display = "none";
    sendOtpButton.style.display = "block";

    phoneMessage.textContent = "";
});


sendOtpButton.addEventListener("click", async function () {

    const phone = phoneInput.value.trim();

    if (!/^[0-9]{10}$/.test(phone)) {

        phoneMessage.style.color = "red";

        phoneMessage.textContent =
            "Enter a valid 10-digit phone number.";

        return;
    }

    sendOtpButton.disabled = true;

    phoneMessage.style.color = "#075e54";

    phoneMessage.textContent =
        "Generating OTP...";

    try {

        const response = await fetch(
            "/phone-send-otp",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    phone: phone
                })
            }
        );

        const data = await response.json();

        if (data.success) {

            phoneMessage.style.color = "green";

            phoneMessage.textContent =
                "OTP generated. Check your Node.js terminal.";

            otpInput.style.display = "block";
            verifyOtpButton.style.display = "block";
            backToLoginButton.style.display = "block";

            sendOtpButton.style.display = "none";

            otpInput.focus();

        } else {

            phoneMessage.style.color = "red";

            phoneMessage.textContent =
                data.message || "Could not generate OTP.";

            sendOtpButton.disabled = false;
        }

    } catch (error) {

        console.error(error);

        phoneMessage.style.color = "red";

        phoneMessage.textContent =
            "Server connection failed.";

        sendOtpButton.disabled = false;
    }
});


verifyOtpButton.addEventListener("click", async function () {

    const phone = phoneInput.value.trim();
    const otp = otpInput.value.trim();

    if (!/^[0-9]{10}$/.test(phone)) {

        phoneMessage.style.color = "red";
        phoneMessage.textContent =
            "Enter a valid 10-digit phone number.";

        return;
    }

    if (!/^[0-9]{6}$/.test(otp)) {

        phoneMessage.style.color = "red";
        phoneMessage.textContent =
            "Enter the 6-digit OTP.";

        return;
    }

    verifyOtpButton.disabled = true;

    phoneMessage.style.color = "#075e54";

    phoneMessage.textContent =
        "Verifying OTP...";

    try {

        const response = await fetch(
            "/phone-verify-otp",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    phone: phone,
                    otp: otp
                })
            }
        );

        const data = await response.json();

        if (data.success) {

            localStorage.setItem(
                "chatToken",
                data.token
            );

            localStorage.setItem(
                "chatUsername",
                data.username
            );

            phoneMessage.style.color = "green";

            phoneMessage.textContent =
                "Login successful!";

            setTimeout(function () {

                window.location.href =
                    "/index.html";

            }, 500);

        } else {

            phoneMessage.style.color = "red";

            phoneMessage.textContent =
                data.message ||
                "OTP verification failed.";

            verifyOtpButton.disabled = false;
        }

    } catch (error) {

        console.error(error);

        phoneMessage.style.color = "red";

        phoneMessage.textContent =
            "Server connection failed.";

        verifyOtpButton.disabled = false;
    }
});

/* =========================================
   GOOGLE LOGIN
========================================= */


async function handleGoogleLogin(response) {

    try {


        if (!response || !response.credential) {

            alert(
                "Google login information was not received."
            );

            return;

        }


        const result =
            await fetch(
                "/google-login",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            credential:
                                response.credential

                        })

                }
            );


        const data =
            await result.json();


        if (data.success) {


            /* Save JWT token */

            localStorage.setItem(
                "chatToken",
                data.token
            );


            /* Save username */

            localStorage.setItem(
                "chatUsername",
                data.username
            );


            /* Open chat */

            window.location.href =
                "/index.html";


        }

        else {


            alert(
                data.message ||
                "Google login failed."
            );

        }


    }

    catch (error) {


        console.error(
            "Google login error:",
            error
        );


        alert(
            "Something went wrong with Google login."
        );

    }

}

</script>


</body>

</html>
